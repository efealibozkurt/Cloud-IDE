appId: com.efe.cloudide
productName: Cloud IDE
copyright: Copyright © 2026 Cloud IDE

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.map"
  # Yalnızca tarayıcıda kullanılan WebAssembly dosyaları; masaüstünde onnxruntime-node çalışır
  - "!**/node_modules/@xenova/transformers/dist/**"
  - "!**/node_modules/onnxruntime-web/dist/*.wasm"

# Chromium'un onlarca dil dosyasından yalnızca arayüzün desteklediği diller
electronLanguages:
  - tr
  - en-US

# Gömülü arduino-cli ve pencere ikonu her platformda kendi dosyasıyla paketlenir (aşağıdaki win/linux bölümleri).
# src/main/utils/cliPath.ts → process.resourcesPath/arduino-cli/arduino-cli(.exe)
# src/main/index.ts        → process.resourcesPath/icon.ico (Windows) | icon.png (Linux)

asar: true
asarUnpack:
  - "**/node_modules/serialport/**"
  - "**/node_modules/@serialport/**"
  # RAG gömme modeli: onnxruntime'ın DLL'leri asar dışında olmalı
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/*.node"
  - "**/*.dll"

win:
  icon: resources/icon.ico
  # Diğer işletim sistemlerinin onnxruntime kütüphaneleri pakete girmez
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/win32/arm64/**"
  legalTrademarks: Cloud IDE
  extraResources:
    - from: resources/arduino-cli
      to: arduino-cli
      filter:
        - arduino-cli.exe
        # GPL-3.0: lisans metni ve kaynak kod bildirimi ikiliyle birlikte dağıtılır
        - LICENSE.txt
        - NOTICE.txt
    - from: resources/icon.ico
      to: icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Cloud IDE
  uninstallDisplayName: Cloud IDE
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  runAfterFinish: true
  # Boşluksuz ad: GitHub yüklemede boşluğu noktaya çevirir ve latest.yml ile uyuşmazlık çıkar
  artifactName: Cloud-IDE-Setup-${version}.${ext}

linux:
  icon: resources/icon.png
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/{darwin,win32}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/linux/arm64/**"
  category: Development
  synopsis: AI destekli Arduino ve gömülü sistem IDE'si
  maintainer: Efe Ali Bozkurt <iletisim@efealibozkurt.com.tr>
  executableName: cloud-ide
  extraResources:
    # Önce: node scripts/arduino-cli-indir.mjs linux x64
    - from: resources/arduino-cli
      to: arduino-cli
      filter:
        - arduino-cli
        - LICENSE.txt
        - NOTICE.txt
    - from: resources/icon.png
      to: icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  # Boşluksuz ad: latest-linux.yml ile uyuşsun (otomatik güncelleme AppImage üzerinden çalışır)
  artifactName: Cloud-IDE-${version}-x86_64.${ext}

deb:
  artifactName: cloud-ide_${version}_amd64.${ext}
  # Seri port için dialout grubu gerekir; kurulum sonrası notu README'de
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

publish:
  provider: github
  owner: efealibozkurt
  repo: Cloud-IDE

portable:
  artifactName: Cloud-IDE-${version}-portable.${ext}
